<!DOCTYPE html>
<html>

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
        crossorigin="anonymous">
</head>

<body>

    <!-- Button 1: Primary -->
    <button id="button-1" class="btn btn-primary">
        Primary
    </button>

    <!-- Button 2: Outline Secondary -->
    <button id="button-2" class="btn btn-outline-secondary">
        Outline Secondary
    </button>

    <!-- Button 3: Success Large -->
    <button id="button-3" class="btn btn-success btn-lg">
        Success Large
    </button>

    <!-- Button 4: Danger Small -->
    <button id="button-4" class="btn btn-danger btn-sm">
        Danger Small
    </button>

    <!-- Button 5: Warning Large Full Width -->
    <button id="button-5" class="btn btn-warning btn-lg w-100">
        Warning Large Full Width
    </button>

    <!-- Button 6: Disabled Info -->
    <button id="button-6" class="btn btn-info" disabled>
        Disabled Info
    </button>

    <!-- Button 7: Light -->
    <button id="button-7" class="btn btn-light">
        Light
    </button>

    <!-- Button 8: Link -->
    <button id="button-8" class="btn btn-link">
        Link
    </button>

</body>

</html>
